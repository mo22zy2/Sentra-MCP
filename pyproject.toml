[project]
name = "sentra"
version = "0.1.0"
description = "Sentra — local-first MCP server for mock exam generation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=2,<3",
  "pymupdf>=1.26",
  "pydantic>=2.12",
  "anyio>=4.9",
]

[project.scripts]
sentra = "sentra.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8",
  "anyio[trio]>=4.9",
]

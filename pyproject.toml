[project]
name = "sentra-mcp"
version = "0.1.0"
description = "Sentra — local-first MCP server for mock exam generation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "mo22zy2" }]
keywords = ["mcp", "mock-exam", "education", "opencode", "study"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "mcp>=2,<3",
  "pymupdf>=1.26",
  "pydantic>=2.12",
  "anyio>=4.9",
]

[project.urls]
Homepage = "https://github.com/mo22zy2/Sentra-MCP"
Issues = "https://github.com/mo22zy2/Sentra-MCP/issues"

[project.scripts]
sentra-mcp = "sentra.server:main"
sentra = "sentra.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8",
  "anyio[trio]>=4.9",
]

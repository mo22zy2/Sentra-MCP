name: publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # manual "Run workflow" button in the Actions tab (re-publish safety net)

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish
